name: Bookmark module
on:
  pull_request:
    paths:
      - 'bookmarks/vanilla/**'
      - '.github/workflows/bookmark-module.yml'
jobs:
  bookmarks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookmarks/vanilla
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm test -- --runInBand
