name: remoteStorage data modules
on:
  push:
    paths: ['remotestorage/**', '.github/workflows/rs-modules.yml']
  pull_request:
    paths: ['remotestorage/**', '.github/workflows/rs-modules.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix remotestorage
      - run: npm test --prefix remotestorage
      - run: npm run build --prefix remotestorage
      - run: git diff --exit-code -- remotestorage/dist/modules.js
