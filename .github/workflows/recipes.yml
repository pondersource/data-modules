name: Recipes module
on:
  pull_request:
    paths:
      - 'recipes/**'
      - '.github/workflows/recipes.yml'
jobs:
  recipes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: recipes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-package-lock --no-audit
      - run: npm test
