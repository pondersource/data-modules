name: Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

###################### Contacts module

      - name: Install contacts dependencies
        working-directory: ./contacts
        run: npm ci

      - name: Build contacts doc
        working-directory: ./contacts
        run: npm run build:doc

######################
###################### bookmarks/vanilla module

      - name: Install bookmarks/vanilla dependencies
        working-directory: ./bookmarks/vanilla
        run: npm ci

      - name: Build bookmarks/vanilla doc
        working-directory: ./bookmarks/vanilla
        run: npm run build:doc

######################
###################### bookmarks/soukai module

      - name: Install bookmarks/soukai dependencies
        working-directory: ./bookmarks/soukai
        run: npm ci

      - name: Build bookmarks/soukai doc
        working-directory: ./bookmarks/soukai
        run: npm run build:doc

######################
###################### bookmarks/rdflib module

      - name: Install bookmarks/rdflib dependencies
        working-directory: ./bookmarks/rdflib
        run: npm ci

      - name: Build bookmarks/rdflib doc
        working-directory: ./bookmarks/rdflib
        run: npm run build:doc

######################
###################### chats/rdflib module

      - name: Install chats/rdflib dependencies
        working-directory: ./chats/rdflib
        run: npm ci

      - name: Build chats/rdflib doc
        working-directory: ./chats/rdflib
        run: npm run build:doc

######################
###################### rdflib utils

      - name: Install rdflib utils dependencies
        working-directory: ./utils/rdflib
        run: npm ci

      - name: Build utils/rdflib doc
        working-directory: ./utils/rdflib
        run: npm run build:doc

######################

      - name: Upload pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'gh-pages'

  deploy:
    # Forks and PRs build the same documentation without creating a Pages site.
    if: github.repository == 'solid-contrib/data-modules' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
