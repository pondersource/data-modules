name: Flashcards package

on:
  pull_request:
    paths:
      - "flashcards/**"
      - ".github/workflows/flashcards.yml"
  push:
    branches: [main, feat/flashcards-rdf-schemas]
    paths:
      - "flashcards/**"
      - ".github/workflows/flashcards.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: flashcards
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: npm install --ignore-scripts --package-lock=false --no-audit --no-fund
      - run: npm test
      - name: Validate the installed tarball
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          consumer="$RUNNER_TEMP/flashcards-consumer"
          mkdir -p "$consumer/test"
          cp test/*.test.mjs "$consumer/test/"
          cd "$consumer"
          npm init -y
          npm install --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/solid-data-modules-flashcards-0.1.0.tgz" n3@2.13.12 rdf-validate-shacl@0.6.5
          node --test test/*.test.mjs
